services:
  lite:
    image: ghcr.io/generation-i-systems/audiobook-librarian-lite:latest
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ./data:/app/storage
    environment:
      APP_KEY: ""
      APP_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS URL}
      LITE_REGISTRATION_OPEN: "true"
      LITE_OTP_ENABLED: "false"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST to the public DNS name}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - lite
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
